name: Compilar ejecutable Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  # Sin el ref en el group: un tag nuevo cancela el build de un tag viejo
  # que todavía esté corriendo, no solo reintentos del mismo tag/rama. Sin
  # esto, dos tags pusheados con poca diferencia pueden terminar en
  # cualquier orden y GitHub marca "latest" al que publicó último, no al
  # de versión más alta.
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Compilar con PyInstaller
        run: pyinstaller worm_app.spec

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: CElegansLab-Windows
          path: dist/CElegansLab/

      - name: Empaquetar en .zip para el release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/CElegansLab -DestinationPath CElegansLab-Windows.zip

      - name: Publicar release en GitHub (dispara la actualización automática)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CElegansLab-Windows.zip
          name: C. elegans Lab ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
